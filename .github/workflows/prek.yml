name: Prek
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  prek:
    name: "prek"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run pre-commit hook
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3
        with:
          prek-version: '0.5.0'
