name: Prek
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"

jobs:
  prek:
    name: "prek"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run pre-commit hook
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16
        with:
          prek-version: '0.5.0'
